<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змінні vs Список CPython</title>
<style>
    :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --border: #cbd5e1;
        --text: #0f172a;
        --muted: #64748b;
        
        --lamp-gold: #f59e0b;
        --lamp-blue: #0ea5e9;
        
        --c-sys: #0284c7;   /* Синій: змінні / вказівники */
        --c-hdr: #d97706;   /* Бурштиновий: заголовок PyListObject */
        --c-list: #059669;  /* Смарагдовий: буфер списку */
        --c-data: #7c3aed;  /* Фіолетовий: об'єкти чисел */
    }

    * { box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); user-select: none; overflow-x: hidden; }

    /* Панель керування */
    .top-bar {
        max-width: 820px; margin: 0 auto 10px auto; display: flex;
        justify-content: space-between; align-items: center; background: var(--card-bg);
        padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    }
    .btn-group { display: flex; gap: 6px; }
    .mode-btn {
        background: #f1f5f9; color: var(--text); border: 1px solid var(--border);
        padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold;
        transition: all 0.15s;
    }
    .mode-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    
    .action-btn {
        background: var(--c-sys); color: #fff; border: none; padding: 6px 12px;
        border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold;
    }
    .action-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

    .reset-btn {
        background: #f1f5f9; color: var(--muted); border: 1px solid var(--border);
        padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold;
    }
    .reset-btn:hover { background: #e2e8f0; color: var(--text); }

    .append-btn {
        background: var(--c-list); color: #fff; border: none; padding: 6px 12px;
        border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold;
        display: none;
    }
    .append-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

    /* Сцена */
    .stage {
        max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; position: relative;
    }

    .memory-region {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 12px; position: relative;
    }
    .region-title {
        font-size: 10px; font-weight: 800; text-transform: uppercase;
        letter-spacing: 0.8px; margin-bottom: 4px; display: flex; justify-content: space-between;
    }

    /* Стовпці 0..23 */
    .cols-header { display: flex; margin-left: 60px; margin-bottom: 3px; gap: 2px; }
    .col-idx { width: 16px; text-align: center; font-size: 8px; color: var(--muted); }
    .col-idx.sep { border-right: 1px dashed #cbd5e1; }

    /* Рядки */
    .rows-box { display: flex; flex-direction: column; gap: 6px; }
    .row-line { display: flex; align-items: center; gap: 6px; }
    .row-label { width: 54px; font-size: 9px; color: var(--muted); text-align: right; }

    .lamps-container {
        display: flex; gap: 2px; padding: 3px; background: #f8fafc;
        border: 1px solid #e2e8f0; border-radius: 6px; position: relative;
    }

    /* Байт ламп */
    .byte-unit {
        display: flex; gap: 2px; padding: 2px 2px 12px 2px; border-radius: 4px;
        position: relative; transition: all 0.2s;
    }
    .byte-unit.sys-var { border: 2px solid var(--c-sys); background: rgba(2, 132, 199, 0.04); }
    .byte-unit.hdr-box { border: 2px solid var(--c-hdr); background: rgba(217, 119, 6, 0.05); }
    .byte-unit.buf-box { border: 2px solid var(--c-list); background: rgba(5, 150, 105, 0.04); }
    .byte-unit.buf-reserved { border: 2px dashed #94a3b8; background: transparent; }
    .byte-unit.data-box { border: 2px solid var(--c-data); background: rgba(124, 58, 237, 0.04); }

    /* Теги над байтами */
    .unit-tag {
        position: absolute; top: -8px; left: 3px; font-size: 8px; font-weight: bold;
        padding: 0 4px; border-radius: 3px; color: #fff; z-index: 2;
    }
    .sys-var .unit-tag { background: var(--c-sys); }
    .hdr-box .unit-tag { background: var(--c-hdr); }
    .buf-box .unit-tag { background: var(--c-list); }
    .buf-reserved .unit-tag { background: #94a3b8; }
    .data-box .unit-tag { background: var(--c-data); }

    /* Значення внизу */
    .val-tag {
        position: absolute; bottom: 1px; left: 0; width: 100%; text-align: center;
        font-size: 8px; font-weight: bold;
    }
    .sys-var .val-tag { color: var(--c-sys); }
    .hdr-box .val-tag { color: var(--c-hdr); font-size: 9px; }
    .buf-box .val-tag { color: var(--c-list); }
    .buf-reserved .val-tag { color: #94a3b8; }
    .data-box .val-tag { color: var(--c-data); font-size: 10px; }

    /* Міні-лампа */
    .lamp { width: 14px; display: flex; flex-direction: column; align-items: center; position: relative; }
    .lamp-svg { width: 14px; height: 18px; overflow: visible; }
    .lamp-glow { opacity: 0; filter: blur(2px); }
    .lamp-shade { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
    .lamp-bulb { fill: #cbd5e1; }
    .lamp-stem, .lamp-base { stroke: #64748b; stroke-width: 1.5; fill: #f8fafc; }

    .lit-gold .lamp-glow { opacity: 0.9; fill: var(--lamp-gold); }
    .lit-gold .lamp-shade { fill: #f59e0b; stroke: #d97706; }
    .lit-gold .lamp-bulb { fill: #fff; }

    .lit-blue .lamp-glow { opacity: 0.85; fill: var(--lamp-blue); filter: blur(3px); }
    .lit-blue .lamp-shade { fill: #38bdf8; stroke: #0284c7; }
    .lit-blue .lamp-bulb { fill: #fff; }

    /* Шар стрілок */
    #arrows-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 100;
    }
    .arr-path { fill: none; stroke-linecap: round; }
</style>
</head>
<body>

<div class="top-bar">
    <div class="btn-group">
        <button id="btn-1" class="mode-btn active" onclick="setMode(1)">1. Окремі змінні</button>
        <button id="btn-2" class="mode-btn" onclick="setMode(2)">2. Список CPython</button>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
        <!-- Керування для режиму 1 -->
        <button id="btn-add-var" class="action-btn" onclick="addNextVar()">+ Створити x1 = 5</button>
        <button id="btn-reset-var" class="reset-btn" onclick="resetVars()">Скинути</button>

        <!-- Керування для режиму 2 (без змін) -->
        <button id="btn-append" class="append-btn" onclick="triggerAppend()">+ x.append(9)</button>
        <div id="status-desc" style="font-size:11px; font-weight:bold; color:var(--muted);"></div>
    </div>
</div>

<div class="stage" id="stage">

    <!-- РІВЕНЬ 1: СТЕК / ЗМІННІ -->
    <div class="memory-region">
        <div class="region-title" style="color: var(--c-sys);">
            <span>1. Простір імен (Стек)</span>
            <span style="color: var(--muted); font-size: 8px;">[Вказівники]</span>
        </div>
        <div class="cols-header" id="cols-header"></div>
        <div class="rows-box" id="sec-stack"></div>
    </div>

    <!-- РІВЕНЬ 2: ЗАГОЛОВОК СПИСКУ (Тільки для Режиму 2) -->
    <div class="memory-region" id="sec-hdr-region">
        <div class="region-title" style="color: var(--c-hdr);">
            <span>2. Заголовок PyListObject у купі</span>
            <span style="color: var(--muted); font-size: 8px;">[len / capacity / *items]</span>
        </div>
        <div class="rows-box" id="sec-hdr"></div>
    </div>

    <!-- РІВЕНЬ 3: БУФЕР ПОСИЛАНЬ (Тільки для Режиму 2) -->
    <div class="memory-region" id="sec-buf-region">
        <div class="region-title" style="color: var(--c-list);">
            <span>3. Буфер посилань (ob_item)</span>
            <span style="color: var(--muted); font-size: 8px;">[Масив адрес із резервом]</span>
        </div>
        <div class="rows-box" id="sec-buf"></div>
    </div>

    <!-- РІВЕНЬ 4: ОБ'ЄКТИ ДАНИХ (КУПА) -->
    <div class="memory-region">
        <div class="region-title" style="color: var(--c-data);">
            <span><span id="data-step-num">2</span>. Об'єкти даних у купі (PyLongObject)</span>
            <span style="color: var(--muted); font-size: 8px;">[Розкидані числа]</span>
        </div>
        <div class="rows-box" id="sec-data"></div>
    </div>

    <svg id="arrows-layer"></svg>

</div>

<script>
let currentMode = 1;
let varCount = 0; // Для режиму 1: скільки змінних зараз створено (0..5)
let isAppended = false;

// Опис 5 змінних для Режиму 1
const varDefs = [
    { name: 'x1', val: 5, addr: 80,  sysId: 'src-0', objId: 'obj-5', bias:  25 },
    { name: 'x2', val: 3, addr: 112, sysId: 'src-1', objId: 'obj-3', bias: -20 },
    { name: 'x3', val: 8, addr: 64,  sysId: 'src-2', objId: 'obj-8', bias: -45 },
    { name: 'x4', val: 1, addr: 128, sysId: 'src-3', objId: 'obj-1', bias:  35 },
    { name: 'x5', val: 6, addr: 96,  sysId: 'src-4', objId: 'obj-6', bias:   0 },
];

function createMiniLamp(isLit, isBlue) {
    const litCls = isLit ? (isBlue ? 'lit-blue' : 'lit-gold') : '';
    return `
    <div class="lamp ${litCls}">
        <svg class="lamp-svg" viewBox="0 0 34 42">
            <circle class="lamp-glow" cx="17" cy="16" r="14" />
            <ellipse class="lamp-base" cx="17" cy="38" rx="13" ry="2.5" />
            <line class="lamp-stem" x1="17" y1="38" x2="17" y2="16" />
            <circle class="lamp-bulb" cx="17" cy="16" r="3.5" />
            <polygon class="lamp-shade" points="10,5 24,5 30,18 4,18" />
        </svg>
    </div>`;
}

function createLamps(val, isBlue) {
    let h = '';
    for (let b = 7; b >= 0; b--) h += createMiniLamp((val >> b) & 1, isBlue);
    return h;
}

function emptyLamps(count, isBlue=false) {
    let h = '<div style="display:flex; gap:2px;">';
    for (let i = 0; i < count; i++) h += createMiniLamp(false, isBlue);
    return h + '</div>';
}

function renderScene() {
    let ch = '';
    for (let c = 0; c < 24; c++) ch += `<div class="col-idx ${(c+1)%8===0 && c!==23 ? 'sep':''}">${c}</div>`;
    document.getElementById('cols-header').innerHTML = ch;

    const stackBox = document.getElementById('sec-stack');
    const hdrRegion = document.getElementById('sec-hdr-region');
    const hdrBox = document.getElementById('sec-hdr');
    const bufRegion = document.getElementById('sec-buf-region');
    const bufBox = document.getElementById('sec-buf');
    const dataBox = document.getElementById('sec-data');
    const appendBtn = document.getElementById('btn-append');
    const addVarBtn = document.getElementById('btn-add-var');
    const resetVarBtn = document.getElementById('btn-reset-var');
    const desc = document.getElementById('status-desc');

    stackBox.innerHTML = '';
    hdrBox.innerHTML = '';
    bufBox.innerHTML = '';
    dataBox.innerHTML = '';

    appendBtn.style.display = (currentMode === 2) ? 'block' : 'none';
    addVarBtn.style.display = (currentMode === 1) ? 'block' : 'none';
    resetVarBtn.style.display = (currentMode === 1 && varCount > 0) ? 'block' : 'none';
    document.getElementById('data-step-num').textContent = (currentMode === 2) ? '4' : '2';

    /* ================= 1. ОКРЕМІ ЗМІННІ (ПОКРОКОВЕ ДОДАВАННЯ) ================= */
    if (currentMode === 1) {
        hdrRegion.style.display = 'none';
        bufRegion.style.display = 'none';

        // Оновлюємо кнопку та опис
        if (varCount < 5) {
            addVarBtn.disabled = false;
            addVarBtn.textContent = `+ Створити ${varDefs[varCount].name} = ${varDefs[varCount].val}`;
        } else {
            addVarBtn.disabled = true;
            addVarBtn.textContent = `Усі 5 змінних створено`;
        }

        desc.textContent = (varCount === 0) 
            ? "Пам'ять чиста" 
            : `${varCount} / 5 створено: змінні займають довільні місця`;

        // Рядки стека: показуємо тільки створені вказівники
        const b0 = (varCount >= 1) ? `<div class="byte-unit sys-var" id="src-0"><div class="unit-tag">x1</div>${createLamps(80, true)}<div class="val-tag">➔ #80</div></div>` : emptyLamps(8, true);
        const b1 = (varCount >= 2) ? `<div class="byte-unit sys-var" id="src-1"><div class="unit-tag">x2</div>${createLamps(112, true)}<div class="val-tag">➔ #112</div></div>` : emptyLamps(8, true);
        const b2 = (varCount >= 3) ? `<div class="byte-unit sys-var" id="src-2"><div class="unit-tag">x3</div>${createLamps(64, true)}<div class="val-tag">➔ #64</div></div>` : emptyLamps(8, true);
        const b3 = (varCount >= 4) ? `<div class="byte-unit sys-var" id="src-3"><div class="unit-tag">x4</div>${createLamps(128, true)}<div class="val-tag">➔ #128</div></div>` : emptyLamps(8, true);
        const b4 = (varCount >= 5) ? `<div class="byte-unit sys-var" id="src-4"><div class="unit-tag">x5</div>${createLamps(96, true)}<div class="val-tag">➔ #96</div></div>` : emptyLamps(8, true);

        stackBox.innerHTML = `
        <div class="row-line"><div class="row-label">#00..#23</div><div class="lamps-container">
            ${b0}${b1}${b2}
        </div></div>
        <div class="row-line"><div class="row-label">#24..#47</div><div class="lamps-container">
            ${b3}${b4}${emptyLamps(8, true)}
        </div></div>`;

        // Рядки купи: числа спалахують у міру створення відповідних змінних
        const d_obj8 = (varCount >= 3) ? `<div class="byte-unit data-box" id="obj-8"><div class="unit-tag">#64</div>${createLamps(8, false)}<div class="val-tag">x3 = 8</div></div>` : emptyLamps(8);
        const d_obj5 = (varCount >= 1) ? `<div class="byte-unit data-box" id="obj-5"><div class="unit-tag">#80</div>${createLamps(5, false)}<div class="val-tag">x1 = 5</div></div>` : emptyLamps(8);
        const d_obj6 = (varCount >= 5) ? `<div class="byte-unit data-box" id="obj-6"><div class="unit-tag">#96</div>${createLamps(6, false)}<div class="val-tag">x5 = 6</div></div>` : emptyLamps(8);
        const d_obj3 = (varCount >= 2) ? `<div class="byte-unit data-box" id="obj-3"><div class="unit-tag">#112</div>${createLamps(3, false)}<div class="val-tag">x2 = 3</div></div>` : emptyLamps(8);
        const d_obj1 = (varCount >= 4) ? `<div class="byte-unit data-box" id="obj-1"><div class="unit-tag">#128</div>${createLamps(1, false)}<div class="val-tag">x4 = 1</div></div>` : emptyLamps(8);

        dataBox.innerHTML = `
        <div class="row-line"><div class="row-label">#64..#87</div><div class="lamps-container">
            ${d_obj8}${emptyLamps(8)}${d_obj5}
        </div></div>
        <div class="row-line"><div class="row-label">#88..#111</div><div class="lamps-container">
            ${emptyLamps(8)}${d_obj6}${emptyLamps(8)}
        </div></div>
        <div class="row-line"><div class="row-label">#112..#135</div><div class="lamps-container">
            ${d_obj3}${emptyLamps(8)}${d_obj1}
        </div></div>`;
    }

    /* ================= 2. СПИСОК CPYTHON (БЕЗ ЗМІН) ================= */
    else if (currentMode === 2) {
        hdrRegion.style.display = 'block';
        bufRegion.style.display = 'block';

        const curLen = isAppended ? 6 : 5;

        // 1. Змінна x -> Заголовок списку #24
        stackBox.innerHTML = `
        <div class="row-line"><div class="row-label">#00..#23</div><div class="lamps-container">
            <div class="byte-unit sys-var" id="var-x"><div class="unit-tag">x</div>${createLamps(24, true)}<div class="val-tag">➔ #24 (список)</div></div>
            ${emptyLamps(16, true)}
        </div></div>`;

        // 2. Заголовок PyListObject: len, capacity, *items -> #48
        hdrBox.innerHTML = `
        <div class="row-line"><div class="row-label">#24..#47</div><div class="lamps-container">
            <div class="byte-unit hdr-box" id="hdr-len"><div class="unit-tag">len</div>${createLamps(curLen, false)}<div class="val-tag">= ${curLen}</div></div>
            <div class="byte-unit hdr-box"><div class="unit-tag">capacity</div>${createLamps(8, false)}<div class="val-tag">= 8</div></div>
            <div class="byte-unit hdr-box" id="hdr-items"><div class="unit-tag">*items</div>${createLamps(48, true)}<div class="val-tag">➔ #48 (буфер)</div></div>
        </div></div>`;

        // 3. Буфер посилань
        const slot5HTML = isAppended
            ? `<div class="byte-unit buf-box" id="buf-5"><div class="unit-tag">[5]</div>${createLamps(144, true)}<div class="val-tag">➔ #144</div></div>`
            : `<div class="byte-unit buf-reserved"><div class="unit-tag">[5]</div>${createLamps(0, true)}<div class="val-tag">резерв</div></div>`;

        bufBox.innerHTML = `
        <div class="row-line"><div class="row-label">#48..#71</div><div class="lamps-container">
            <div class="byte-unit buf-box" id="buf-0"><div class="unit-tag">[0]</div>${createLamps(80, true)}<div class="val-tag">➔ #80</div></div>
            <div class="byte-unit buf-box" id="buf-1"><div class="unit-tag">[1]</div>${createLamps(112, true)}<div class="val-tag">➔ #112</div></div>
            <div class="byte-unit buf-box" id="buf-2"><div class="unit-tag">[2]</div>${createLamps(64, true)}<div class="val-tag">➔ #64</div></div>
        </div></div>
        <div class="row-line"><div class="row-label">#72..#95</div><div class="lamps-container">
            <div class="byte-unit buf-box" id="buf-3"><div class="unit-tag">[3]</div>${createLamps(128, true)}<div class="val-tag">➔ #128</div></div>
            <div class="byte-unit buf-box" id="buf-4"><div class="unit-tag">[4]</div>${createLamps(96, true)}<div class="val-tag">➔ #96</div></div>
            ${slot5HTML}
        </div></div>`;

        // 4. Ті самі розкидані об'єкти (+ число 9 при append)
        const appendObjHTML = isAppended
            ? `<div class="byte-unit data-box" id="obj-9"><div class="unit-tag" style="background:var(--c-list);">#144</div>${createLamps(9, false)}<div class="val-tag">= 9</div></div>`
            : emptyLamps(8);

        dataBox.innerHTML = `
        <div class="row-line"><div class="row-label">#64..#87</div><div class="lamps-container">
            <div class="byte-unit data-box" id="obj-8"><div class="unit-tag">#64</div>${createLamps(8, false)}<div class="val-tag">= 8</div></div>
            ${emptyLamps(8)}
            <div class="byte-unit data-box" id="obj-5"><div class="unit-tag">#80</div>${createLamps(5, false)}<div class="val-tag">= 5</div></div>
        </div></div>
        <div class="row-line"><div class="row-label">#88..#111</div><div class="lamps-container">
            ${emptyLamps(8)}
            <div class="byte-unit data-box" id="obj-6"><div class="unit-tag">#96</div>${createLamps(6, false)}<div class="val-tag">= 6</div></div>
            ${emptyLamps(8)}
        </div></div>
        <div class="row-line"><div class="row-label">#112..#135</div><div class="lamps-container">
            <div class="byte-unit data-box" id="obj-3"><div class="unit-tag">#112</div>${createLamps(3, false)}<div class="val-tag">= 3</div></div>
            ${emptyLamps(8)}
            <div class="byte-unit data-box" id="obj-1"><div class="unit-tag">#128</div>${createLamps(1, false)}<div class="val-tag">= 1</div></div>
        </div></div>
        <div class="row-line"><div class="row-label">#136..#159</div><div class="lamps-container">
            ${emptyLamps(8)}
            ${appendObjHTML}
            ${emptyLamps(8)}
        </div></div>`;
    }

    setTimeout(drawArrows, 30);
}

function drawArrows() {
    const stage = document.getElementById('stage').getBoundingClientRect();
    const svg = document.getElementById('arrows-layer');
    svg.innerHTML = `
        <defs>
            <marker id="arr-sys" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="var(--c-sys)" /></marker>
            <marker id="arr-hdr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="var(--c-hdr)" /></marker>
            <marker id="arr-ptr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="var(--c-list)" /></marker>
        </defs>`;

    function addWavyCurve(srcId, dstId, markerId, strokeColor, waveBias = 0) {
        const sEl = document.getElementById(srcId);
        const dEl = document.getElementById(dstId);
        if (!sEl || !dEl) return;

        const s = sEl.getBoundingClientRect();
        const d = dEl.getBoundingClientRect();

        const x1 = s.left + s.width / 2 - stage.left;
        const y1 = s.bottom - stage.top;
        const x2 = d.left + d.width / 2 - stage.left;
        const y2 = d.top - stage.top - 2;

        const dy = y2 - y1;
        const cp1x = x1 + waveBias;
        const cp1y = y1 + dy * 0.45;
        const cp2x = x2 - waveBias;
        const cp2y = y2 - dy * 0.45;

        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("class", "arr-path");
        p.setAttribute("stroke", strokeColor);
        p.setAttribute("stroke-width", "2");
        p.setAttribute("stroke-dasharray", "4");
        p.setAttribute("marker-end", `url(#${markerId})`);
        p.setAttribute("d", `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`);
        svg.appendChild(p);
    }

    if (currentMode === 1) {
        // Малюємо стрілки тільки для вже створених змінних
        for (let i = 0; i < varCount; i++) {
            const v = varDefs[i];
            addWavyCurve(v.sysId, v.objId, 'arr-sys', 'var(--c-sys)', v.bias);
        }
    } else if (currentMode === 2) {
        // 1. x -> PyListObject
        addWavyCurve('var-x', 'hdr-len', 'arr-sys', 'var(--c-sys)', 0);

        // 2. *items -> буфер
        addWavyCurve('hdr-items', 'buf-0', 'arr-hdr', 'var(--c-hdr)', -15);

        // 3. Буфер -> розкидані числа
        addWavyCurve('buf-0', 'obj-5', 'arr-ptr', 'var(--c-list)',  20);
        addWavyCurve('buf-1', 'obj-3', 'arr-ptr', 'var(--c-list)', -25);
        addWavyCurve('buf-2', 'obj-8', 'arr-ptr', 'var(--c-list)', -40);
        addWavyCurve('buf-3', 'obj-1', 'arr-ptr', 'var(--c-list)',  30);
        addWavyCurve('buf-4', 'obj-6', 'arr-ptr', 'var(--c-list)',   0);

        if (isAppended) {
            addWavyCurve('buf-5', 'obj-9', 'arr-ptr', 'var(--c-list)', 10);
        }
    }
}

function setMode(m) {
    currentMode = m;
    isAppended = false;
    document.querySelectorAll('.mode-btn').forEach((b, idx) => {
        b.classList.toggle('active', idx + 1 === m);
    });

    const desc = document.getElementById('status-desc');
    const appBtn = document.getElementById('btn-append');
    appBtn.disabled = false;
    appBtn.textContent = "+ x.append(9)";

    if (m === 2) {
        desc.textContent = "x ➔ PyListObject (len/cap) ➔ буфер адрес ➔ ті самі числа";
    }

    renderScene();
}

function addNextVar() {
    if (varCount < 5) {
        varCount++;
        renderScene();
    }
}

function resetVars() {
    varCount = 0;
    renderScene();
}

function triggerAppend() {
    isAppended = true;
    const btn = document.getElementById('btn-append');
    btn.disabled = true;
    btn.textContent = "Додано: len=6 (резерв спрацював!)";
    renderScene();
}

window.addEventListener('load', () => setMode(1));
window.addEventListener('resize', drawArrows);
</script>

</body>
