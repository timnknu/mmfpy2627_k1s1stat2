<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Покрокове виділення пам'яті (24 стовпці)</title>
<style>
    :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --border: #cbd5e1;
        --text: #0f172a;
        --muted: #64748b;
        --lamp-gold: #f59e0b;
        --c-var: #0284c7;
        --c-list: #7c3aed;
    }

    * { box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); user-select: none; }

    /* Панель керування */
    .top-bar {
        max-width: 860px; margin: 0 auto 12px auto; display: flex;
        justify-content: space-between; align-items: center; background: var(--card-bg);
        padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    }
    .btn-group { display: flex; gap: 8px; align-items: center; }

    button {
        background: #0f172a; color: #fff; border: none; padding: 7px 14px;
        border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
        transition: background 0.15s, opacity 0.15s;
    }
    button:hover:not(:disabled) { background: #334155; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover:not(:disabled) { background: #e2e8f0; }

    .step-counter { font-size: 12px; font-weight: bold; color: var(--muted); min-width: 60px; text-align: center; }

    /* Сцена */
    .stage {
        max-width: 860px; margin: 0 auto; display: grid;
        grid-template-columns: 150px 1fr; gap: 16px; position: relative;
    }

    /* Ліва панель */
    .vars-panel {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px;
        min-height: 220px;
    }
    .empty-hint {
        margin: auto; font-size: 11px; color: var(--muted); text-align: center;
    }
    .var-card {
        border: 2px solid var(--c-var); background: #f0f9ff; border-radius: 6px;
        padding: 6px 10px; font-size: 13px; font-weight: bold; color: var(--c-var);
        display: flex; justify-content: space-between;
    }
    .unified-card {
        border: 2px solid var(--c-list); background: #faf5ff; border-radius: 6px;
        padding: 12px 10px; font-size: 13px; font-weight: bold; color: var(--c-list);
        display: none; height: 100%; align-items: center; justify-content: center;
        text-align: center;
    }

    .is-list .var-card { display: none !important; }
    .is-list .unified-card { display: flex; }
    .is-list .empty-hint { display: none; }

    /* Права панель */
    .matrix-card {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 8px; padding: 12px 14px; position: relative;
    }

    /* Стовпці */
    .cols-header {
        display: flex; margin-left: 56px; margin-bottom: 4px; gap: 2px;
    }
    .col-idx {
        width: 22px; text-align: center; font-size: 9px; color: var(--muted);
    }
    .col-idx.sep { border-right: 1px dashed #cbd5e1; }

    /* Рядки */
    .rows-box { display: flex; flex-direction: column; gap: 8px; }
    .row-line { display: flex; align-items: center; gap: 6px; }
    .row-title { width: 50px; font-size: 10px; color: var(--muted); text-align: right; }

    .lamps-container {
        display: flex; gap: 2px; padding: 4px; background: #f8fafc;
        border: 1px solid #e2e8f0; border-radius: 6px; position: relative;
    }

    /* Зовнішня рамка списку */
    .list-outer-frame {
        display: flex; gap: 2px; border: 2px solid transparent; border-radius: 6px;
        padding: 2px; transition: border-color 0.2s;
    }
    .is-list .list-outer-frame.has-items {
        border-color: var(--c-list); background: rgba(124, 58, 237, 0.04);
    }

    /* 8-лампова область */
    .byte-unit {
        display: flex; gap: 2px; padding: 3px; border-radius: 4px;
        border: 2px solid transparent; position: relative; transition: all 0.2s;
    }
    .byte-unit.allocated {
        border-color: var(--c-var); background: rgba(2, 132, 199, 0.04);
    }
    .is-list .byte-unit.allocated {
        border: 2px dashed var(--c-list); background: transparent;
    }

    .unit-tag {
        position: absolute; top: -9px; left: 4px; font-size: 8px; font-weight: bold;
        padding: 0 4px; border-radius: 3px; background: var(--c-var); color: #fff;
        display: none;
    }
    .byte-unit.allocated .unit-tag { display: block; }
    .is-list .byte-unit.allocated .unit-tag { background: var(--c-list); }

    /* Лампа */
    .lamp { width: 18px; display: flex; flex-direction: column; align-items: center; }
    .lamp-svg { width: 18px; height: 24px; overflow: visible; }
    .lamp-glow { opacity: 0; filter: blur(2px); fill: var(--lamp-gold); }
    .lamp-shade { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
    .lamp-bulb { fill: #cbd5e1; }
    .lamp-stem, .lamp-base { stroke: #64748b; stroke-width: 1.5; fill: #f8fafc; }

    .lit .lamp-glow { opacity: 0.85; }
    .lit .lamp-shade { fill: #f59e0b; stroke: #d97706; }
    .lit .lamp-bulb { fill: #fff; filter: drop-shadow(0 0 2px #fbbf24); }

    /* SVG стрілки */
    #arrows-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 100;
    }
    .arr-line {
        fill: none; stroke: var(--c-var); stroke-width: 2; stroke-linecap: round;
        display: none;
    }
    .arr-line.arr-unified { stroke: var(--c-list); stroke-width: 2.5; }
</style>
</head>
<body>

<div class="top-bar">
    <div class="btn-group">
        <button class="secondary" id="btn-prev" onclick="stepBackward()">&lt; Назад</button>
        <button id="btn-next" onclick="stepForward()">+ Додати змінну &gt;</button>
        <button class="secondary" onclick="resetAll()">Скинути</button>
        <span class="step-counter" id="step-counter">0 / 5</span>
    </div>
    <button class="secondary" id="btn-mode" onclick="toggleMode()">Згрупувати в список: x</button>
</div>

<div class="stage" id="main-stage">

    <!-- ЛІВОРУЧ -->
    <div class="vars-panel" id="vars-panel">
        <div class="empty-hint" id="empty-hint">Пам'ять порожня.<br>Натисніть «+ Додати змінну»</div>
        <div class="var-card" id="card-0" style="display:none;"><span>x1</span><span>= 5</span></div>
        <div class="var-card" id="card-1" style="display:none;"><span>x2</span><span>= 3</span></div>
        <div class="var-card" id="card-2" style="display:none;"><span>x3</span><span>= 8</span></div>
        <div class="var-card" id="card-3" style="display:none;"><span>x4</span><span>= 1</span></div>
        <div class="var-card" id="card-4" style="display:none;"><span>x5</span><span>= 6</span></div>

        <div class="unified-card" id="card-unified">
            x = []
        </div>
    </div>

    <!-- ПРАВОРУЧ -->
    <div class="matrix-card">
        <div class="cols-header" id="cols-header"></div>
        <div class="rows-box" id="rows-box"></div>
    </div>

    <!-- ШАР СТРІЛОК -->
    <svg id="arrows-layer">
        <defs>
            <marker id="m-var" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
                <polygon points="0 0, 6 2.5, 0 5" fill="var(--c-var)" />
            </marker>
            <marker id="m-list" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
                <polygon points="0 0, 6 2.5, 0 5" fill="var(--c-list)" />
            </marker>
        </defs>
        <path id="arr-0" class="arr-line" marker-end="url(#m-var)" d=""/>
        <path id="arr-1" class="arr-line" marker-end="url(#m-var)" d=""/>
        <path id="arr-2" class="arr-line" marker-end="url(#m-var)" d=""/>
        <path id="arr-3" class="arr-line" marker-end="url(#m-var)" d=""/>
        <path id="arr-4" class="arr-line" marker-end="url(#m-var)" d=""/>
        <path id="arr-u" class="arr-line arr-unified" marker-end="url(#m-list)" d=""/>
    </svg>

</div>

<script>
let count = 0; // Кількість активних змінних: 0..5
let isListMode = false;
const values = [5, 3, 8, 1, 6];

function createMiniLamp(isLit) {
    return `
    <div class="lamp ${isLit ? 'lit' : ''}">
        <svg class="lamp-svg" viewBox="0 0 34 42">
            <circle class="lamp-glow" cx="17" cy="16" r="14" />
            <ellipse class="lamp-base" cx="17" cy="38" rx="13" ry="2.5" />
            <line class="lamp-stem" x1="17" y1="38" x2="17" y2="16" />
            <circle class="lamp-bulb" cx="17" cy="16" r="3.5" />
            <polygon class="lamp-shade" points="10,5 24,5 30,18 4,18" />
        </svg>
    </div>`;
}

function createEmptyLamps(qty) {
    const el = document.createElement('div');
    el.style.display = 'flex';
    el.style.gap = '2px';
    for (let i = 0; i < qty; i++) {
        el.insertAdjacentHTML('beforeend', createMiniLamp(false));
    }
    return el;
}

function renderMatrixBase() {
    // Стовпці 0..23
    const colHeader = document.getElementById('cols-header');
    let hdr = '';
    for (let c = 0; c < 24; c++) {
        const isSep = ((c + 1) % 8 === 0 && c !== 23);
        hdr += `<div class="col-idx ${isSep ? 'sep' : ''}">c${c}</div>`;
    }
    colHeader.innerHTML = hdr;

    const rowsBox = document.getElementById('rows-box');
    rowsBox.innerHTML = '';

    // Рядок 0: 3 блоки по 8 ламп
    const r0 = document.createElement('div');
    r0.className = 'row-line';
    r0.innerHTML = `<div class="row-title">Ряд 0</div>`;
    const line0 = document.createElement('div');
    line0.className = 'lamps-container';

    const outer0 = document.createElement('div');
    outer0.className = 'list-outer-frame';
    outer0.id = 'outer-0';
    for (let i = 0; i < 3; i++) outer0.appendChild(createByteSlot(i));
    line0.appendChild(outer0);
    r0.appendChild(line0);
    rowsBox.appendChild(r0);

    // Рядок 1: 2 блоки по 8 ламп + 8 вільних
    const r1 = document.createElement('div');
    r1.className = 'row-line';
    r1.innerHTML = `<div class="row-title">Ряд 1</div>`;
    const line1 = document.createElement('div');
    line1.className = 'lamps-container';

    const outer1 = document.createElement('div');
    outer1.className = 'list-outer-frame';
    outer1.id = 'outer-1';
    for (let i = 3; i < 5; i++) outer1.appendChild(createByteSlot(i));
    line1.appendChild(outer1);
    line1.appendChild(createEmptyLamps(8));
    r1.appendChild(line1);
    rowsBox.appendChild(r1);

    // Рядок 2: 24 вільні лампи
    const r2 = document.createElement('div');
    r2.className = 'row-line';
    r2.innerHTML = `<div class="row-title">Ряд 2</div>`;
    const line2 = document.createElement('div');
    line2.className = 'lamps-container';
    line2.appendChild(createEmptyLamps(24));
    r2.appendChild(line2);
    rowsBox.appendChild(r2);
}

function createByteSlot(idx) {
    const el = document.createElement('div');
    el.className = 'byte-unit';
    el.id = `byte-${idx}`;

    const tag = document.createElement('div');
    tag.className = 'unit-tag';
    tag.id = `tag-${idx}`;
    el.appendChild(tag);

    // Контейнер 8 ламп
    const lampsBox = document.createElement('div');
    lampsBox.style.display = 'flex';
    lampsBox.style.gap = '2px';
    lampsBox.id = `lamps-box-${idx}`;
    for (let b = 7; b >= 0; b--) {
        lampsBox.insertAdjacentHTML('beforeend', createMiniLamp(false));
    }
    el.appendChild(lampsBox);
    return el;
}

function updateState() {
    // 1. Кнопки та лічильник
    document.getElementById('step-counter').textContent = `${count} / 5`;
    document.getElementById('btn-prev').disabled = (count === 0);
    document.getElementById('btn-next').disabled = (count === 5);

    // 2. Ліва панель (змінні)
    document.getElementById('empty-hint').style.display = (count === 0 && !isListMode) ? 'block' : 'none';

    for (let i = 0; i < 5; i++) {
        const card = document.getElementById(`card-${i}`);
        card.style.display = (i < count && !isListMode) ? 'flex' : 'none';
    }

    const activeVals = values.slice(0, count);
    document.getElementById('card-unified').textContent = `x = [${activeVals.join(', ')}]`;

    // 3. Лампи та рамки
    for (let i = 0; i < 5; i++) {
        const byteEl = document.getElementById(`byte-${i}`);
        const tagEl = document.getElementById(`tag-${i}`);
        const boxEl = document.getElementById(`lamps-box-${i}`);

        if (i < count) {
            byteEl.classList.add('allocated');
            tagEl.textContent = isListMode ? `[${i}]` : `x${i+1}`;
            // Увімкнення відповідних ламп
            let lampsHTML = '';
            for (let b = 7; b >= 0; b--) {
                const isLit = (values[i] >> b) & 1;
                lampsHTML += createMiniLamp(isLit);
            }
            boxEl.innerHTML = lampsHTML;
        } else {
            byteEl.classList.remove('allocated');
            // Всі лампи вимкнені
            let lampsHTML = '';
            for (let b = 7; b >= 0; b--) lampsHTML += createMiniLamp(false);
            boxEl.innerHTML = lampsHTML;
        }
    }

    // Рамки списку
    document.getElementById('outer-0').classList.toggle('has-items', count > 0 && isListMode);
    document.getElementById('outer-1').classList.toggle('has-items', count > 3 && isListMode);

    updateArrows();
}

function updateArrows() {
    const stage = document.getElementById('main-stage').getBoundingClientRect();

    function setPath(fromId, toId, pathId, show) {
        const path = document.getElementById(pathId);
        if (!show) { path.style.display = 'none'; return; }

        const fromEl = document.getElementById(fromId);
        const toEl = document.getElementById(toId);
        if (!fromEl || !toEl) return;

        const f = fromEl.getBoundingClientRect();
        const t = toEl.getBoundingClientRect();

        const startX = f.right - stage.left;
        const startY = f.top + (f.height / 2) - stage.top;
        const endX = t.left - stage.left - 4;
        const endY = t.top + 8 - stage.top;

        const midX = startX + (endX - startX) * 0.45;
        path.setAttribute('d', `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`);
        path.style.display = 'block';
    }

    // Стрілки окремих змінних
    for (let i = 0; i < 5; i++) {
        setPath(`card-${i}`, `byte-${i}`, `arr-${i}`, !isListMode && (i < count));
    }

    // Спільна стрілка списку
    setPath('card-unified', 'byte-0', 'arr-u', isListMode && (count > 0));
}

function stepForward() {
    if (count < 5) {
        count++;
        updateState();
    }
}

function stepBackward() {
    if (count > 0) {
        count--;
        updateState();
    }
}

function resetAll() {
    count = 0;
    isListMode = false;
    document.getElementById('main-stage').classList.remove('is-list');
    document.getElementById('btn-mode').textContent = "Згрупувати в список: x";
    updateState();
}

function toggleMode() {
    isListMode = !isListMode;
    const stage = document.getElementById('main-stage');
    const btn = document.getElementById('btn-mode');

    stage.classList.toggle('is-list', isListMode);
    btn.textContent = isListMode ? "Розділити на окремі: x1..x5" : "Згрупувати в список: x";

    updateState();
}

// Керування стрілками клавіатури
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        stepForward();
    } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        stepBackward();
    }
});

window.addEventListener('load', () => {
    renderMatrixBase();
    updateState();
});
window.addEventListener('resize', updateArrows);
</script>

</body>
</html>
